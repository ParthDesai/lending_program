[package]
name = "lending-program"
version = "0.1.0"
edition = "2018"

[features]
no-entrypoint = []
test-bpf = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
spl-token = {version = "3.0.1", features = ["no-entrypoint"]}
solana-program = "1.7.4"
arrayref = "0.3.6"
thiserror = "1.0.21"
num-derive = "0.3"
num-traits = "0.2"
chainlink = { git = "https://github.com/smartcontractkit/chainlink-solana", rev="154792b0ed195523069b6154f6a2871fe583e039", package = "chainlink-solana", features = ["no-entrypoint"] }

[lib]
crate-type = ["cdylib", "lib"]

[dev-dependencies]
solana-sdk = "1.7.4"
solana-program-test = "1.7.4"
tokio = { version = "1.13", features = ["macros"]}
borsh = "0.9"
bincode = "1.3.3"

